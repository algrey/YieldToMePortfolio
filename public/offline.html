<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#06110f" />
    <title>YieldToMe · Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-width: 320px;
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 32px;
        background: #06110f;
        color: #f2efe7;
      }
      main {
        width: min(100%, 640px);
        padding: 40px;
        border: 1px solid #22322d;
        background: #0b1c18;
      }
      .mark {
        height: 28px;
        display: flex;
        align-items: end;
        gap: 3px;
        margin-bottom: 48px;
      }
      .mark span {
        width: 5px;
        background: #63c878;
      }
      .mark span:nth-child(1) {
        height: 11px;
      }
      .mark span:nth-child(2) {
        height: 21px;
      }
      .mark span:nth-child(3) {
        height: 17px;
      }
      .mark span:nth-child(4) {
        height: 27px;
      }
      p {
        color: #a5ada8;
        line-height: 1.7;
      }
      .label {
        color: #63c878;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 12px 0 18px;
        font-family: Georgia, serif;
        font-size: clamp(36px, 8vw, 58px);
        font-weight: 400;
        letter-spacing: -0.04em;
      }
      button {
        min-height: 44px;
        margin-top: 16px;
        padding: 0 18px;
        border: 1px solid #63c878;
        background: transparent;
        color: #f2efe7;
        font: inherit;
        cursor: pointer;
      }
      @media (max-width: 520px) {
        main {
          padding: 28px 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <p class="label">Connection unavailable</p>
      <h1>YieldToMe is offline.</h1>
      <p>
        Private portfolio data is intentionally not stored by the offline shell.
        Reconnect to load your workspace safely.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
